volumes:
  pg_data:

services:
  db:
    image: postgres:17-alpine
    env_file: ../.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d {DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    image: python5152plus/tables_booking_system
    env_file: ../.env
    ports:
      - 8000:8000
    depends_on:
      - db

