# version: "3.9"

services:
  db:
    image: postgres:17-alpine
    env_file: ../.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - "./pgdata:/var/lib/postgresql/data/pgdata"
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  rabbit:
    image: rabbitmq:3-management
    container_name: rabbit
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

  backend:
    build:
      context: ../
      dockerfile: src/Dockerfile.local
    volumes:
      - ../:/app
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: 1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  celery:
    build:
      context: ../
      dockerfile: src/Dockerfile.local
    container_name: celery_worker
    command: >
      sh -c "celery -A src.celery.app.celery_app worker --loglevel=info"
    volumes:
      - ../:/app
    depends_on:
      rabbit:
        condition: service_started
    env_file:
      - ../.env
    networks:
      - app-network

  flower:
    image: mher/flower
    env_file: ../.env
    command: celery --broker=${CELERY_BROKER_URL} flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      rabbit:
        condition: service_started
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ../nginx/local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
