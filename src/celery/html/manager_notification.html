<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новое бронирование</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background-color: #8B4513;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            padding: 25px;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        .detail-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        .detail-table .label {
            font-weight: bold;
            color: #8B4513;
            width: 30%;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #777;
            background-color: #f5f5f5;
        }

        .menu-section {
            background-color: #fffaf0;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }

        .menu-item {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #ddd;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .message-section {
            background-color: #f0f8ff;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 4px solid #4682b4;
        }

        .highlight {
            color: #8B4513;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="email-container">
        <div class="header">
            <h1>🍽️ Новое бронирование</h1>
        </div>

        <div class="content">
            <table class="detail-table">
                <tr>
                    <td class="label">Клиент:</td>
                    <td class="highlight">{client_name}</td>
                </tr>
                <tr>
                    <td class="label">Телефон:</td>
                    <td><a href="tel:{phone}">{phone}</a></td>
                </tr>
                <tr>
                    <td class="label">Email:</td>
                    <td><a href="mailto:{email}">{email}</a></td>
                </tr>
                <tr>
                    <td class="label">Стол на:</td>
                    <td>{guests_count} человек</td>
                </tr>
                <tr>
                    <td class="label">Время:</td>
                    <td class="highlight">{time_slot_start} - {time_slot_end}</td>
                </tr>
            </table>

        <div class="menu-section">
            <h3>🍴 Выбранное меню:</h3>
            <div class="menu-items">
                {menu}
            </div>
        </div>


        <div class="message-section">
            <h3>💬 Сообщение от клиента:</h3>
            <p>{message}</p>
        </div>
        </div>

        <div class="footer">
            <p>Это письмо сгенерировано автоматически. Пожалуйста, не отвечайте на него.</p>
        </div>
    </div>
</body>

</html>
