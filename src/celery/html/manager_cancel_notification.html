<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Бронирование отменено</title>
</head>
<body style="font-family: Arial, sans-serif; line-height:1.6; color:#333; margin:0; padding:0; background:#f9f9f9;">
  <div style="max-width:600px; margin:20px auto; background:#fff; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); overflow:hidden;">

    <div style="background:#8B0000; color:#fff; padding:20px; text-align:center;">
      <h1 style="margin:0;">❌ Бронирование отменено</h1>
    </div>

    <div style="padding:25px;">
      <p>Клиент <b>{user_username}</b> отменил бронирование в кафе <b>{cafe_name}</b>.</p>
      <p>Email клиента: <a href="mailto:{user_email}">{user_email}</a></p>
      <p>Телефон клиента: <a href="tel:{user_phone}">{user_phone}</a></p>
    </div>

    <div style="text-align:center; padding:15px; font-size:12px; color:#777; background:#f5f5f5;">
      Это письмо сгенерировано автоматически.
    </div>
  </div>
</body>
</html>
