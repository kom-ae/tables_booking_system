name: Telegram Group Notifications

on:
  push:
    branches:
      - main
      - develop
      # - feature/CI_CD_workflow
  pull_request:
    types: [opened, closed]

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Message to Group
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_KOM_AE }}, ${{ secrets.TELEGRAM_GROUP_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔔 Новое обновление в репозитории:
            - Тип события: ${{ github.event_name }}
            - Бранч: ${{ github.ref_name }}
            - Коммит: ${{ github.sha }}
            - Автор: ${{ github.actor }}
            - Сообщение: ${{ github.event.head_commit.message }}
