name: Test Workflow

on:
  push:
    branches:
      - feature/CI_CD_workflow

jobs:
  backend_tests:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - name: Set-up python
        uses: actions/setup-python@v5
        with: 
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./src/requirements.txt
      - name: run pytest
        env:
          DB_ENGINE=sqlite
        run: python -m pytest tests/ -v -m "not skip" 
