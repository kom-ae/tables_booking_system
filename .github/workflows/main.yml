name: Tables_Booking_Main_Workflow

on:
  push:
    branches:
      - main

jobs:
  backend_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run tests with docker-compose
        run: |
          docker compose -f infra/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test-runner

      - name: Copy test.log from container
        if: always()
        run: |
          docker cp $(docker ps -aqf "name=test-runner"):/app/test.log ./test.log || echo "No test.log found"

      - name: Upload test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: ./test.log
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose -f infra/docker-compose.test.yml down -v

      - name: Send Telegram message (tests)
        if: success() || failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_GROUP_ID }}, ${{ secrets.TELEGRAM_KOM_AE }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Тесты (main):
            - Репозиторий: ${{ github.repository }}
            - Бранч: ${{ github.ref_name }}
            - Коммит: ${{ github.sha }}
            - Статус: ${{ job.status }}

  build_backend_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    needs:
      - backend_tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/tables_booking_system:latest
            ${{ vars.DOCKER_USERNAME }}/tables_booking_system:${{ github.sha }}

      - name: Send Telegram message (DockerHub push)
        if: success() || failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_GROUP_ID }}, ${{ secrets.TELEGRAM_KOM_AE }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🐳 Push Docker image:
            - Репозиторий: ${{ github.repository }}
            - Коммит: ${{ github.sha }}
            - Теги: latest, ${{ github.sha }}
            - Статус: ${{ job.status }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_backend_and_push_to_docker_hub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Copy docker-compose.production.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "./infra/docker-compose.production.yml"
          target: "/opt/bron-2/"
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /opt/bron-2/
            sudo docker compose -f infra/docker-compose.production.yml pull
            sudo docker compose -f infra/docker-compose.production.yml down
            sudo docker compose -f infra/docker-compose.production.yml up -d

      - name: Send Telegram message (deploy)
        if: success() || failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_GROUP_ID }}, ${{ secrets.TELEGRAM_KOM_AE }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Деплой завершён:
            - Репозиторий: ${{ github.repository }}
            - Бранч: ${{ github.ref_name }}
            - Коммит: ${{ github.sha }}
            - Статус: ${{ job.status }}
